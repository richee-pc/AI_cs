<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="동작으로 하는 게임 - 티처블 머신 포즈 모델로 바로 즐기는 별 받기 게임">
<meta name="theme-color" content="#E9F3FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1A2E" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="별 받기 · 폭탄 피하기 · 동작 게임">
<meta property="og:description" content="동작으로 하는 게임 - 티처블 머신 포즈 모델로 바로 즐기는 별 받기 게임">
<meta property="og:type" content="website">
<link rel="preload" href="font/body-reg.woff2?v=69ddb123" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="font/disp-bold.woff2?v=f5f08870" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>html,body{margin:0;padding:0}</style>
<title>별 받기 · 폭탄 피하기 · 동작 게임</title>
</head>
<body>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#0d1b2e;color:#e8f2ff;text-align:center;
  font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
h1{font-size:18px;margin:0 0 6px}
#hud{font-size:17px;font-weight:800;margin-bottom:10px}
#map{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
#map .m{background:#16304f;border-radius:10px;padding:7px 10px;font-size:13px;text-align:left}
#map .m b{display:block;color:#9fc0e6;font-size:12px;margin-bottom:4px}
#map select{font:inherit;font-size:13px;padding:4px 6px;border-radius:7px;
  border:1px solid #2c4c74;background:#0d1b2e;color:#e8f2ff}
#warn{color:#ffcf8a;font-size:13px;margin:0 0 10px;min-height:18px}
#row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
canvas{background:#12233c;border-radius:14px;display:block}
#side{display:flex;flex-direction:column;gap:8px;align-items:center}
#act{font-size:19px;font-weight:800;background:#1c3a5e;border-radius:10px;padding:9px 14px;min-width:180px}
#bars{width:190px;font-size:12px;text-align:left}
.b{margin:4px 0}.b i{display:block;font-style:normal;color:#9fc0e6}
.b u{display:block;height:7px;background:#2f6fec;border-radius:4px;text-decoration:none}
button{font:inherit;font-weight:800;padding:11px 22px;border-radius:99px;border:0;
  background:#2f6fec;color:#fff;cursor:pointer;margin:12px 5px 0}
button.g{background:#1c3a5e}
#msg{font-size:13px;color:#9fc0e6;margin-top:10px;min-height:20px;line-height:1.7}
#err{display:none;max-width:640px;margin:14px auto 0;background:#3a2410;border:1px solid #a86b2a;
  border-radius:14px;padding:16px 18px;text-align:left;font-size:14px;line-height:1.8}
#err b{color:#ffcf8a}
#err code{background:#22160a;border-radius:6px;padding:2px 7px;font-size:13px}
a{color:#8fc5fb}
#urlbox{max-width:620px;margin:16px auto 0}
#urlbox input{width:100%;font:inherit;font-size:14px;padding:11px 13px;border-radius:11px;
  border:1px solid #2c4c74;background:#12233c;color:#e8f2ff}
</style>

<h1>⭐ 별 받기 · 💣 폭탄 피하기</h1>
<div id="hud">점수 <span id="sc">0</span> · 목숨 <span id="hp">3</span></div>
<div id="map"></div><div id="warn"></div>

<div id="row">
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="side">
    <canvas id="cam" width="190" height="190"></canvas>
    <div id="act">시작을 눌러 주세요</div>
    <div id="bars"></div>
  </div>
</div>

<div id="urlbox" hidden>
  <input type="url" id="mIn" placeholder="https://teachablemachine.withgoogle.com/models/…/" autocomplete="off">
</div>
<button id="go">카메라 켜고 시작</button>
<button id="again" class="g" hidden>다시 시작</button>
<button id="camoff" class="g" hidden>카메라 끄기</button>
<div id="msg">왼손 ← 왼쪽 · 오른손 → 오른쪽 · 양손 ↑ 점프 · 정지 멈춤</div>
<div id="err"></div>

<!-- 바깥에서 받아 오는 두 파일. integrity 는 «받은 파일이 그 파일이 맞는지»
     브라우저가 대조하는 값입니다. 중간에 바뀌면 실행되지 않습니다.
     (카메라를 쓰는 쪽이라 더 중요합니다.) 판을 올릴 때 값도 함께 바꿔야 합니다. -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"
        integrity="sha384-LBtUZzDp17Y7UgB/KFromf1LnY7o5ls8Oxm4vEAoTM0U+JzaadctX2/buQiNHyQU"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"
        integrity="sha384-POIH9gbcOOlZlvBMszFySOsacczo0L1G9WHaMWJn4LAeg2Mo/RFQh7Ev8j22W8Zx"
        crossorigin="anonymous"></script>
<script>
(function(){
  /* 모델 주소 : 주소창의 ?m= → 저장해 둔 값 → 아래 기본값 순서로 찾는다 */
  var MODEL = '__MODEL__';
  function fromQuery(){
    var m = location.search.match(/[?&]m=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }
  if(MODEL.indexOf('__') === 0) MODEL = '';
  if(!MODEL) MODEL = fromQuery();
  if(!MODEL){ try{ MODEL = localStorage.getItem('ai-pose-model') || ''; }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var model, webcam, camCtx, running = false, act = '', conf = 0, over = false;
  var MAP = {}, LABELS = [];
  var cv = $('cv'), g = cv.getContext('2d');
  var GY = 316, P = { x:220, y:GY-44, w:40, h:44, vx:0, vy:0, ground:true };
  var items = [], score = 0, lives = 3, tick = 0;

  function say(t){ $('msg').textContent = t; }
  function oops(title, lines){
    $('err').style.display = 'block';
    $('err').innerHTML = '<b>' + title + '</b><br>' + lines.join('<br>');
  }
  function why(e){
    if(!e) return '알 수 없는 문제';
    if(typeof e === 'string') return e;
    return e.message || e.name || String(e);
  }

  /* 이름으로 조작을 짐작하고, 못 알아들으면 순서대로 붙인다 */
  function guess(n){
    n = (n || '').toLowerCase();
    if(/양손|둘다|both|점프|jump|위/.test(n)) return 'jump';
    if(/왼|left/.test(n)) return 'left';
    if(/오른|right/.test(n)) return 'right';
    if(/정지|가만|없|기본|stop|idle|none|neutral/.test(n)) return 'stop';
    return '';
  }
  function buildMap(labels){
    LABELS = labels.slice(); MAP = {};
    var order = ['left','right','jump','stop'], used = {};
    labels.forEach(function(n){ var k = guess(n); if(k && !used[k]){ MAP[n] = k; used[k] = 1; } });
    labels.forEach(function(n){
      if(MAP[n]) return;
      for(var i = 0; i < order.length; i++) if(!used[order[i]]){ MAP[n] = order[i]; used[order[i]] = 1; return; }
      MAP[n] = 'stop';
    });
    drawMap();
  }
  var NAMES = { left:'← 왼쪽', right:'오른쪽 →', jump:'↑ 점프', stop:'정지' };
  function drawMap(){
    $('map').innerHTML = LABELS.map(function(n, i){
      return '<div class="m"><b>' + n + '</b><select data-n="' + i + '">' +
        ['left','right','jump','stop'].map(function(k){
          return '<option value="' + k + '"' + (MAP[n] === k ? ' selected' : '') + '>' + NAMES[k] + '</option>';
        }).join('') + '</select></div>';
    }).join('');
    warn();
  }
  function warn(){
    var have = {};
    LABELS.forEach(function(n){ have[MAP[n]] = 1; });
    $('warn').textContent = (have.left && have.right) ? ''
      : '⚠ 왼쪽과 오른쪽이 모두 연결돼야 움직입니다. 위 상자에서 골라 주세요.';
  }
  /* 다시 그리면 초점이 튄다. 연결표와 경고만 고친다. */
  $('map').addEventListener('change', function(e){
    var s = e.target; if(!s.getAttribute) return;
    var i = s.getAttribute('data-n'); if(i === null) return;
    MAP[LABELS[+i]] = s.value; warn();
  });

  /* ── 카메라를 먼저 켜 보고, 안 되면 «왜» 안 되는지 알려 준다 ── */
  async function openCam(){
    if(!window.isSecureContext)
      throw { kind:'insecure' };
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw { kind:'nodev' };
    var st = await navigator.mediaDevices.getUserMedia({ video:true });
    st.getTracks().forEach(function(t){ t.stop(); });     /* 권한만 확인하고 바로 닫는다 */
  }
  function camHelp(e){
    var n = (e && (e.kind || e.name)) || '';
    if(n === 'insecure') return ['이 페이지가 <b>https 주소가 아닙니다.</b> 브라우저는 안전하지 않은 주소에서 카메라를 켜 주지 않습니다.',
      '<code>https://richee-pc.github.io/AI_cs/play.html</code> 로 다시 열어 주세요.',
      '내려받은 파일(<code>file://</code>)을 두 번 눌러 연 경우에도 이렇게 됩니다.'];
    if(n === 'nodev') return ['브라우저가 <b>카메라 장치를 내주지 않았습니다.</b>',
      '이 페이지가 다른 페이지 «안»에 끼워져 있으면 이렇게 될 수 있습니다 — <b>새 탭에서 직접</b> 열어 주세요.',
      '학교 노트북 정책으로 막혀 있을 수도 있습니다.'];
    if(n === 'NotAllowedError') return ['카메라 사용을 <b>«차단»</b> 으로 눌렀습니다.',
      '주소창 왼쪽 <b>자물쇠(또는 카메라) 아이콘</b> → 카메라를 <b>«허용»</b> 으로 바꾸고 <b>새로 고침</b> 하세요.'];
    if(n === 'NotFoundError' || n === 'OverconstrainedError')
      return ['<b>카메라를 찾지 못했습니다.</b> 노트북에 카메라가 있는지, 가림막이 닫혀 있지 않은지 확인하세요.'];
    if(n === 'NotReadableError') return ['<b>다른 프로그램이 카메라를 쓰고 있습니다.</b>',
      '줌 · 팀즈 · 다른 브라우저 탭을 모두 끄고 다시 눌러 주세요.'];
    return ['카메라를 켜지 못했습니다 : <b>' + why(e) + '</b>'];
  }

  async function init(){
    $('err').style.display = 'none';
    if(!MODEL){
      $('urlbox').hidden = false;
      var v = ($('mIn').value || '').trim();
      if(!v){ say('먼저 티처블 머신 모델 주소를 넣어 주세요'); $('mIn').focus(); return; }
      MODEL = v;
    }
    if(MODEL.slice(-1) !== '/') MODEL += '/';

    $('go').disabled = true;
    try{
      say('카메라를 확인하는 중…');
      await openCam();
    }catch(e){
      $('go').disabled = false;
      say('카메라를 켜지 못했습니다');
      oops('카메라를 켜지 못했습니다', camHelp(e));
      return;
    }
    try{
      say('모델을 불러오는 중…');
      model = await tmPose.load(MODEL + 'model.json', MODEL + 'metadata.json');
      buildMap(model.getClassLabels());
    }catch(e){
      $('go').disabled = false;
      say('모델을 불러오지 못했습니다');
      oops('모델을 불러오지 못했습니다', [
        '주소 : <code>' + MODEL + '</code>',
        '오류 : <b>' + why(e) + '</b>',
        '티처블 머신에서 <b>Export Model → Upload my model</b> 로 나온 <b>sharable link</b> 인지 확인하세요.',
        '주소는 <code>https://teachablemachine.withgoogle.com/models/…/</code> 모양이어야 합니다.']);
      return;
    }
    try{
      say('카메라를 켜는 중…');
      webcam = new tmPose.Webcam(190, 190, true);
      await webcam.setup();
      await webcam.play();
      camCtx = $('cam').getContext('2d');
    }catch(e){
      $('go').disabled = false;
      say('카메라를 켜지 못했습니다');
      oops('카메라를 켜지 못했습니다', camHelp(e));
      return;
    }
    running = true;
    $('go').hidden = true; $('again').hidden = false;
    $('camoff').hidden = false; $('urlbox').hidden = true;
    say('왼손 ← 왼쪽 · 오른손 → 오른쪽 · 양손 ↑ 점프 · 정지 멈춤');
    loop(); game();
  }

  async function loop(){
    if(!running || !webcam) return;
    try{
      webcam.update();
      var r = await model.estimatePose(webcam.canvas);
      var pr = await model.predict(r.posenetOutput);
      var best = pr[0], i;
      for(i = 1; i < pr.length; i++) if(pr[i].probability > best.probability) best = pr[i];
      conf = best.probability;
      act = (conf < 0.7) ? '' : best.className;
      $('act').textContent = (act ? act : '(애매함)') + '  ' + Math.round(conf * 100) + '%';
      var h = '';
      for(i = 0; i < pr.length; i++)
        h += '<div class="b"><i>' + pr[i].className + ' ' + Math.round(pr[i].probability * 100) +
             '%</i><u style="width:' + Math.round(pr[i].probability * 100) + '%"></u></div>';
      $('bars').innerHTML = h;
      camCtx.drawImage(webcam.canvas, 0, 0);
      if(r.pose){
        tmPose.drawKeypoints(r.pose.keypoints, 0.5, camCtx);
        tmPose.drawSkeleton(r.pose.keypoints, 0.5, camCtx);
      }
    }catch(e){ say('인식 중 문제가 생겼습니다 : ' + why(e)); }
    requestAnimationFrame(loop);
  }

  function reset(){ score = 0; lives = 3; items = []; tick = 0; over = false;
    P.x = 220; P.y = GY - P.h; P.vy = 0; }
  function game(){
    var k = MAP[act] || 'stop';
    if(over){ if(k === 'jump') reset(); draw(); requestAnimationFrame(game); return; }
    tick++;
    P.vx = (k === 'left') ? -4.2 : ((k === 'right') ? 4.2 : 0);
    if(k === 'jump' && P.ground){ P.vy = -11.5; P.ground = false; }
    P.x += P.vx; P.vy += 0.55; P.y += P.vy;
    if(P.y > GY - P.h){ P.y = GY - P.h; P.vy = 0; P.ground = true; }
    if(P.x < 4) P.x = 4;
    if(P.x > cv.width - P.w - 4) P.x = cv.width - P.w - 4;
    if(tick % 38 === 0) items.push({ x:20 + Math.random() * (cv.width - 70), y:-26,
      v:1.6 + Math.random() * 1.6, bomb:Math.random() < 0.34 });
    for(var i = items.length - 1; i >= 0; i--){
      var it = items[i]; it.y += it.v;
      if(it.y > cv.height + 30){ items.splice(i, 1); continue; }
      if(it.x < P.x + P.w && it.x + 26 > P.x && it.y < P.y + P.h && it.y + 26 > P.y){
        if(it.bomb){ lives--; if(lives <= 0) over = true; } else score += 10;
        items.splice(i, 1);
      }
    }
    $('sc').textContent = score; $('hp').textContent = lives;
    draw(); requestAnimationFrame(game);
  }
  function draw(){
    g.clearRect(0, 0, cv.width, cv.height);
    g.fillStyle = '#1a3050'; g.fillRect(0, GY, cv.width, cv.height - GY);
    g.textBaseline = 'top'; g.textAlign = 'left'; g.font = '24px serif';
    for(var i = 0; i < items.length; i++) g.fillText(items[i].bomb ? '💣' : '⭐', items[i].x, items[i].y);
    g.fillStyle = '#ffd166'; g.fillRect(P.x, P.y, P.w, P.h);
    g.fillStyle = '#0d1b2e'; g.fillRect(P.x + 9, P.y + 13, 7, 7); g.fillRect(P.x + 24, P.y + 13, 7, 7);
    g.fillRect(P.x + 12, P.y + 29, 16, 4);
    if(over){
      g.fillStyle = 'rgba(6,16,30,.88)'; g.fillRect(0, 0, cv.width, cv.height);
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = 'bold 30px sans-serif';
      g.fillText('게임 끝!  점수 ' + score, cv.width / 2, 142);
      g.font = '16px sans-serif'; g.fillStyle = '#9fc0e6';
      g.fillText('양손을 들면 다시 시작합니다', cv.width / 2, 190);
      g.textAlign = 'left';
    }
  }

  /* ── 카메라 끄기 ────────────────────────────────────────
     켜 둔 채로 두면 이 탭을 닫을 때까지 불이 켜져 있습니다.
     단추로도 끄고, 탭을 떠날 때도 스스로 끕니다.              */
  function camOff(quiet){
    running = false;
    try{
      if(webcam){
        if(webcam.stop) webcam.stop();
        var st = webcam.webcam && webcam.webcam.srcObject;
        if(st && st.getTracks) st.getTracks().forEach(function(t){ t.stop(); });
      }
    }catch(e){}
    webcam = null;
    if(quiet) return;
    $('camoff').hidden = true; $('again').hidden = true;
    $('go').hidden = false; $('go').disabled = false;
    $('go').textContent = '카메라 켜고 다시 시작';
    say('카메라를 껐습니다. 다시 하려면 위 단추를 누르세요.');
  }
  window.addEventListener('pagehide', function(){ camOff(true); });

  $('go').addEventListener('click', init);
  $('again').addEventListener('click', function(){ reset(); });
  $('camoff').addEventListener('click', function(){ camOff(false); });
  if(!MODEL){
    $('urlbox').hidden = false;
    say('티처블 머신 «포즈» 모델 주소를 넣고 시작을 누르세요');
  }
})();
</script>

</body>
</html>
