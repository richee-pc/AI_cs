    + '<div class="rep-sum">'
    + '<div class="rep-kpi"><div class="n">' + totN + ' / ' + totA + '</div><div class="l">완료한 활동</div></div>'
    + '<div class="rep-kpi"><div class="n">' + quizOk + '</div><div class="l">확인 문제 정답</div></div>'
    + '<div class="rep-kpi"><div class="n">' + labOk + '</div><div class="l">실습 통과</div></div>'
    + '<div class="rep-kpi"><div class="n">' + errs + '</div><div class="l">직접 겪어 본 오류</div></div>'
    + '<div class="rep-kpi"><div class="n">' + mins + '분</div><div class="l">학습 시간</div></div>'
    + '</div>'
    + '<div class="rep-wrap"><table class="rep-tb"><thead><tr><th>차시</th><th>개념</th>'
    + '<th style="text-align:center">확인 문제</th><th style="text-align:center">짝 맞추기</th>'
    + '<th style="text-align:center">실습</th><th style="text-align:center">채점 시도</th></tr></thead>'
    + '<tbody>' + body + '</tbody></table></div>'
    + '<div class="rep-act">'
    + '<button class="rb primary" type="button" id="rp-copy">텍스트로 복사</button>'
    + '<button class="rb" type="button" id="rp-txt">기록 파일 내려받기 (.txt)</button>'
    + '<button class="rb" type="button" id="rp-csv">표로 내려받기 (.csv)</button>'
    + '</div>');
}
function reportText(){
  const rows = reportRows();
  const L = [];
  L.push('entry2colab · 학습 활동 기록');
  L.push('이름 : ' + (ST.name || '(미입력)'));
  L.push('수준 : ' + (ST.level === 'A' ? '텍스트 코딩 처음' : ST.level === 'B' ? '조금 해 봄' : '미선택'));
  L.push('작성 : ' + new Date().toLocaleString('ko-KR'));
  L.push('');
  rows.forEach(r => {
    const p = [];
    r.ts.forEach(t => p.push(TASK_LABEL[t] + (r.d[t] ? ' O' : ' -')));
    L.push('[' + PHASES[r.u.phase].n + '] ' + r.u.name + ' : ' + p.join(' / ')
      + (r.d.lab ? ' (채점 ' + r.d.lab.tries + '회' + (r.d.lab.pass ? ', 통과' : '') + ')' : ''));
  });
  L.push('');
  L.push('── 실습에서 내가 쓴 코드 ──');
  rows.forEach(r => {
    if(r.d.lab && r.d.lab.code){
      L.push('');
      L.push('# ' + r.u.name);
      L.push(r.d.lab.code);
    }
  });
  return L.join('\n');
}
function reportCSV(){
  const rows = reportRows();
  const head = ['차시','개념','확인문제','짝맞추기','실습통과','채점시도'];
  const body = rows.map(r => [
    PHASES[r.u.phase].n, r.u.name,
    r.ts.indexOf('quiz') < 0 ? '' : (r.d.quiz && r.d.quiz.ok ? 'O' : 'X'),
    r.ts.indexOf('match') < 0 ? '' : (r.d.match ? 'O' : 'X'),
    r.ts.indexOf('lab') < 0 ? '' : (r.d.lab && r.d.lab.pass ? 'O' : 'X'),
    r.d.lab ? r.d.lab.tries : ''
  ]);
  return [head].concat(body).map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
}
function download(name, text, mime){
  const blob = new Blob(['﻿' + text], {type:(mime || 'text/plain') + ';charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ══════════════════════════════════════════════════════════════
   뼈대 그리기
   ══════════════════════════════════════════════════════════════ */
function drawRail(){
  let last = null;
  $('#rail').innerHTML = UNITS.map((u, i) => {
    const d = ST.done[u.id] || {};
    const ts = tasksOf(u);
    const allDone = ts.length && ts.every(t => d[t]);
    let sep = '';
    if(u.phase !== last){ sep = '<span class="rail-sep">' + PHASES[u.phase].n + '</span>'; last = u.phase; }
    return sep + '<button class="unit-btn" type="button" role="tab" aria-selected="' + (i === ui) + '" data-i="' + i + '">'
      + '<span class="swatch" style="background:' + CAT[u.cat].c + '"></span>'
      + '<span class="n">' + (i + 1) + '</span>' + u.name
      + (allDone ? '<span class="tick">✓</span>' : '') + '</button>';
  }).join('');
}
function drawModes(){
  const u = UNITS[ui];
  $('#modes').innerHTML = u.modes.map(m =>
    '<button class="mode-btn" type="button" role="tab" aria-selected="' + (m === mode) + '" data-m="' + m + '">'
    + MODE_LABEL[m] + '</button>').join('');
}
function drawFlow(){
  const u = UNITS[ui], p = PHASES[u.phase];
  $('#flowbar').innerHTML = '<span class="k">' + esc(p.n) + '</span>'
    + '<span class="goal">' + esc(p.goal) + '</span>'
    + '<span style="margin-left:auto;color:var(--ink-3)">개념 ' + (ui + 1) + ' / ' + UNITS.length + '</span>';
  $('#hk-now').textContent = p.n + ' · ' + u.name + ' · ' + MODE_LABEL[mode];
}
function drawHead(){
  const u = UNITS[ui], c = CAT[u.cat];
  document.documentElement.style.setProperty('--accent', c.c);
  document.documentElement.style.setProperty('--accent-dark', c.d);
  document.documentElement.style.setProperty('--accent-wash', c.c + '1f');
  $('#u-title').innerHTML = '<span class="cat">' + c.n + '</span>' + u.name;
  $('#u-lead').textContent = u.lead;
  const cq = u.quote.c.split(' · ');
  $('#u-quote').innerHTML = '<p class="qt">' + esc(u.quote.t) + '</p><cite><b>' + esc(cq[0]) + '</b>'
    + (cq.length > 1 ? ' · ' + esc(cq.slice(1).join(' · ')) : '') + '</cite>';
  $('#lv-now').textContent = ST.level === 'A' ? '처음' : ST.level === 'B' ? '조금' : '선택';
}
function drawProgress(){
  let n = 0, total = 0;
  UNITS.forEach(u => {
    const d = ST.done[u.id] || {};
    tasksOf(u).forEach(t => { total++; if(d[t]) n++; });
  });
  $('#pfill').style.width = (total ? Math.round(n / total * 100) : 0) + '%';
  $('#pcnt').textContent = n + ' / ' + total;
}
function draw(){
  const u = UNITS[ui];
  if(u.modes.indexOf(mode) < 0) mode = u.modes[0];
  drawRail(); drawModes(); drawHead(); drawFlow();
  const st = $('#stage');
  st.innerHTML = mode === 'map'     ? viewMap(u)
               : mode === 'compare' ? viewCompare(u)
               : mode === 'run'     ? viewRun(u)
               : mode === 'colab'   ? viewColab(u)
               : mode === 'match'   ? viewMatch(u)
               : mode === 'type'    ? viewTyping(u)
               : mode === 'read'    ? viewRead(u)
               : viewLab(u);
  if(mode === 'run') runPrepare(u);
  if(mode === 'colab') document.querySelectorAll('.cell-ta').forEach(autosize);
  if(mode === 'type'){ const el = $('#tp-in'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  drawProgress();
}
function autosize(ta){ ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }

/* ══════════════════════════════════════════════════════════════
   이벤트
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const u = UNITS[ui];

  const unitBtn = e.target.closest('.unit-btn');
  if(unitBtn){ stopAuto(); ui = +unitBtn.dataset.i; draw(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const modeBtn = e.target.closest('.mode-btn');
  if(modeBtn){ stopAuto(); mode = modeBtn.dataset.m; draw(); return; }

  /* 시트 */
  if(e.target.id === 'sheet-x' || e.target.id === 'sheet'){ closeSheet(); return; }
  if(e.target.closest('#btn-level')){ sheetLevel(); return; }
  if(e.target.closest('#btn-err')){ sheetErrors(null); return; }
  if(e.target.closest('#btn-report')){ sheetReport(); return; }
  const lv = e.target.closest('.lvcard');
  if(lv){ applyLevel(lv.dataset.lv); return; }
  const tbm = e.target.closest('.tb-more');
  if(tbm){ sheetErrors(tbm.dataset.err); return; }
  if(e.target.id === 'rp-copy'){
    const t = reportText();
    ST.name = $('#rp-name').value.trim(); save();
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('복사했습니다. 붙여넣기 하세요.'),
      () => toast('복사에 실패했어요. 파일로 내려받아 주세요.'));
    else toast('이 브라우저는 복사를 지원하지 않아요. 파일로 내려받아 주세요.');
    return;
  }
  if(e.target.id === 'rp-txt'){ ST.name = $('#rp-name').value.trim(); save();
    download((ST.name || '학습기록') + '_entry2colab.txt', reportText()); return; }
  if(e.target.id === 'rp-csv'){ ST.name = $('#rp-name').value.trim(); save();
    download((ST.name || '학습기록') + '_entry2colab.csv', reportCSV(), 'text/csv'); return; }

  /* 발표 모드 · 테마 */
  if(e.target.closest('#btn-present')){ togglePresent(); return; }
  if(e.target.id === 'theme-btn'){
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    return;
  }

  /* 코랩 노트북 */
  const runBtn = e.target.closest('[data-run]');
  if(runBtn){ nbRun(u, +runBtn.dataset.run); return; }
  if(e.target.id === 'nb-all'){
    const nb = nbState(u);
    nb.cells.forEach((c, i) => { if(!c.md) nbRun(u, i); });
    return;
  }
  if(e.target.id === 'nb-restart'){
    const nb = nbState(u);
    nb.rt = {}; nb.count = 0; nb.runs = 0;
    nb.cells.forEach(c => { c.n = null; c.out = null; c.err = null; });
    draw(); toast('런타임을 초기화했습니다. 위 셀부터 다시 실행하세요.'); return;
  }
  if(e.target.id === 'nb-reset'){ S[u.id].nb = null; draw(); return; }

  /* 코드 읽어내기 */
  const rdl = e.target.closest('[data-rd]');
  if(rdl){
    const st = S[u.id]; const n = +rdl.dataset.rd;
    st.rd.sel = n;
    if(st.rd.seen.indexOf(n) < 0) st.rd.seen.push(n);
    if(st.rd.seen.length >= Object.keys(u.read.notes).length) mark(u.id, 'read', {seen:st.rd.seen.length});
    draw(); return;
  }

  /* 타이핑 */
  if(e.target.id === 'tp-again'){ S[u.id].tp = null; draw(); return; }

  /* 블록 ↔ 코드 짝 표시 */
  const line = e.target.closest('[data-line]');
  if(line && (mode === 'compare' || mode === 'run')){
    const n = line.dataset.line;
    const on = !line.classList.contains('sel');
    document.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
    if(on) document.querySelectorAll('[data-line="' + n + '"]').forEach(el => el.classList.add('sel'));
    return;
  }

  /* 확인 문제 */
  const q = e.target.closest('.qopt');
  if(q){
    const pickN = +q.dataset.q;
    S[u.id].quiz = pickN;
    mark(u.id, 'quiz', {ok:pickN === u.quiz.ans, pick:pickN});
    draw(); return;
  }

  /* 짝 맞추기 */
  const card = e.target.closest('.mcard');
  if(card){
    const m = S[u.id].match, i = +card.dataset.i;
    if(card.dataset.side === 'l'){ m.pick = (m.pick === i ? null : i); draw(); }
    else if(m.pick !== null){
      m.tries++;
      if(m.pick === i){
        m.solved.push(i); m.pick = null;
        if(m.solved.length === m.pairs.length) mark(u.id, 'match', {tries:m.tries});
        draw();
      } else {
        card.classList.add('wrong');
        setTimeout(() => { m.pick = null; draw(); }, 380);
      }
    }
    return;
  }
  if(e.target.id === 'm-reset'){ S[u.id].match = null; draw(); return; }

  /* 한 단계씩 실행 */
  if(e.target.id === 'r-step'){ if(RUN.idx < RUN.trace.length - 1){ RUN.idx++; paintRun(u); } return; }
  if(e.target.id === 'r-reset'){ runPrepare(u); return; }
  if(e.target.id === 'r-end'){ stopAuto(); RUN.idx = RUN.trace.length - 1; paintRun(u); return; }
  if(e.target.id === 'r-auto'){
    if(RUN.timer){ stopAuto(); }
    else{
      e.target.textContent = '멈춤 ❚❚';
      RUN.timer = setInterval(() => {
        if(RUN.idx >= RUN.trace.length - 1){ stopAuto(); return; }
        RUN.idx++; paintRun(u);
      }, 750);
    }
    return;
  }

  /* 실습 */
  if(e.target.id === 'l-run'){ labRun(u); return; }
  if(e.target.id === 'l-grade'){ labGrade(u); return; }
  if(e.target.id === 'l-reset'){ S[u.id].code = starterOf(u); draw(); return; }
  if(e.target.id === 'l-hint'){
    const v = $('#l-verdict');
    v.className = 'verdict show'; v.style.background = 'var(--warn-bg)'; v.style.color = 'var(--warn)';
    v.innerHTML = '<b>힌트</b> · ' + u.lab.hint;
    return;
  }
  if(e.target.id === 'reset-all'){
    if(!window.confirm('이 브라우저에 저장된 학습 기록을 모두 지웁니다. 계속할까요?')) return;
    ST = {name:'', level:ST.level, started:Date.now(), done:{}};
    save();
    UNITS.forEach(x => S[x.id] = {quiz:null, match:null, code:null, codeB:null, inputs:x.inputs.slice(),
                                  nb:null, tp:null, rd:null});
    draw(); toast('기록을 지웠습니다.'); return;
  }
});

/* 타이핑 입력 */
document.addEventListener('input', e => {
  if(e.target.id === 'tp-in'){
    const u = UNITS[ui], tp = tpState(u);
    tp.val = e.target.value;
    if(tp.val === u.typing.lines[tp.i].t && tp.cleared.indexOf(tp.i) < 0) tp.cleared.push(tp.i);
    paintTyping(u);
    if(tp.cleared.length >= u.typing.lines.length && !dOf(u.id).typing)
      mark(u.id, 'typing', {n:tp.cleared.length});
    return;
  }
  if(e.target.dataset && e.target.dataset.src !== undefined){
    const nb = nbState(UNITS[ui]);
    nb.cells[+e.target.dataset.src].src = e.target.value;
    autosize(e.target);
  }
});
document.addEventListener('change', e => {
  if(e.target.dataset && e.target.dataset.in !== undefined){
    S[UNITS[ui].id].inputs[+e.target.dataset.in] = e.target.value;
    runPrepare(UNITS[ui]);
  }
  if(e.target.id === 'rp-name' || e.target.id === 'lv-name'){ ST.name = e.target.value.trim(); save(); }
});

/* 키보드 */
function typingArea(el){ return el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT'); }
document.addEventListener('keydown', e => {
  const u = UNITS[ui];

  if(e.key === 'Escape'){ closeSheet(); return; }

  /* 타이핑 연습 : Enter 로 다음 줄 */
  if(e.target.id === 'tp-in' && e.key === 'Enter'){
    e.preventDefault();
    const tp = tpState(u);
    if(tp.val === u.typing.lines[tp.i].t){
      if(tp.cleared.indexOf(tp.i) < 0) tp.cleared.push(tp.i);
      tp.i++; tp.val = '';
      if(tp.i >= u.typing.lines.length) mark(u.id, 'typing', {n:tp.cleared.length});
      draw();
    } else toast('아직 다릅니다. 노란 칸의 글자를 확인해 보세요.');
    return;
  }
  /* 코랩 셀 : Shift+Enter 실행, Tab 들여쓰기 */
  if(e.target.dataset && e.target.dataset.src !== undefined){
    if(e.key === 'Enter' && e.shiftKey){ e.preventDefault(); nbRun(u, +e.target.dataset.src); return; }
    if(e.key === 'Tab'){
      e.preventDefault();
      const t = e.target, s = t.selectionStart;
      t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd);
      t.selectionStart = t.selectionEnd = s + 4;
      nbState(u).cells[+t.dataset.src].src = t.value;
      return;
    }
  }
  if(e.target.id === 'l-code' && e.key === 'Tab'){
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 4;
    return;
  }
  if(e.target.matches && e.target.matches('[data-line],[data-rd]') && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault(); e.target.click(); return;
  }

  /* 발표 단축키 — 입력 중일 때는 건드리지 않음 */
  if(typingArea(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
  if($('#sheet').classList.contains('on')) return;
  const k = e.key;
  if(k === 'ArrowRight'){ if(ui < UNITS.length - 1){ ui++; stopAuto(); draw(); } e.preventDefault(); return; }
  if(k === 'ArrowLeft'){ if(ui > 0){ ui--; stopAuto(); draw(); } e.preventDefault(); return; }
  if(k === ']' || k === '}'){
    const i = u.modes.indexOf(mode); mode = u.modes[(i + 1) % u.modes.length]; stopAuto(); draw(); e.preventDefault(); return;
  }
  if(k === '[' || k === '{'){
    const i = u.modes.indexOf(mode); mode = u.modes[(i - 1 + u.modes.length) % u.modes.length]; stopAuto(); draw(); e.preventDefault(); return;
  }
  if(k === ' '){
    if(mode === 'run' && RUN.idx < RUN.trace.length - 1){ RUN.idx++; paintRun(u); e.preventDefault(); }
    return;
  }
  if(k === 'r' || k === 'R'){ if(mode === 'run'){ runPrepare(u); e.preventDefault(); } return; }
  if(k === 'p' || k === 'P'){ togglePresent(); e.preventDefault(); return; }
  if(k === '?'){ sheetHotkeys(); e.preventDefault(); return; }
});

function sheetHotkeys(){
  const rows = [
    ['← →', '이전 / 다음 개념'],
    ['[ ]', '이전 / 다음 학습 모드'],
    ['Space', '한 단계씩 실행에서 다음 단계'],
    ['R', '실행을 처음으로'],
    ['Shift + Enter', '코랩 셀 실행'],
    ['P', '발표 모드 켜기 / 끄기'],
    ['Esc', '창 닫기']
  ];
  openSheet('단축키', '<div class="hkgrid">' + rows.map(r =>
    '<div class="hkrow"><span class="kbd">' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>').join('') + '</div>');
}
function togglePresent(){
  const on = document.documentElement.getAttribute('data-present') === '1';
  document.documentElement.setAttribute('data-present', on ? '0' : '1');
  $('#btn-present').setAttribute('aria-pressed', on ? 'false' : 'true');
  if(!on){
    toast('발표 모드 · ← → 개념 이동, [ ] 모드 이동, ? 단축키');
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  } else if(document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(() => {});
  }
}

/* ── 첫 실행 ── */
if(ST.level){
  document.documentElement.setAttribute('data-level', ST.level);
  ui = UNITS.findIndex(u => u.id === (ST.level === 'A' ? 'colab0' : 'var'));
  if(ui < 0) ui = 0;
  mode = UNITS[ui].modes[0];
  draw();
} else {
  draw();
  sheetLevel();
}
</script>
